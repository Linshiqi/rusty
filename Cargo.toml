[workspace]
resolver = "3"
members = ["crates/rusty-core", "crates/rusty-cli", "crates/rusty-ai", "crates/rusty-embed", "crates/rusty-i18n", "crates/rusty-term", "crates/rusty-edit", "crates/rusty-lsp", "crates/rusty-dbg", "crates/rusty-git", "crates/rusty-draw", "crates/rusty-mcu", "crates/rusty-desk", "crates/rusty-setup", "crates/rusty-release"]
# Test fixtures are real, standalone workspaces that rusty-core analyzes at test
# time. They must not join this workspace or their deps would unify with ours
# and the numbers under test would drift with our own dependency changes.
exclude = ["crates/rusty-core/tests/fixtures"]

[workspace.package]
# The released version, bumped in every release commit, and what a
# development build calls itself. The release workflow also stamps the tag
# into it, so a forgotten bump cannot ship the wrong number — but a build at
# HEAD would still call itself the old one and be offered its own release as
# an update. `rusty-release`'s tests hold this and the newest CHANGELOG
# heading to one number.
version = "0.7.0"
edition = "2024"
# 1.89 for `File::lock`: rusty windows are separate processes sharing one
# workbench.toml, and a lock the OS holds is what serialises their writes.
rust-version = "1.89"
# GPLv3: the window is drawn with Slint, used under its GPLv3 option, and the
# program that links it is offered on the same terms.
license = "GPL-3.0-only"
repository = "https://github.com/Linshiqi/rusty"
authors = ["rusty contributors"]

[workspace.lints.rust]
# Deny, not forbid: the built-in shell's console-mode FFI is the one
# sanctioned exception, opted in per module with a stated reason.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# rusty-core spends its time inside guppy/petgraph; unoptimized deps make
# `cargo test` on a real workspace unbearably slow.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
