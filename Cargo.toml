[workspace]
resolver = "3"
members = ["crates/rusty-core", "crates/rusty-cli", "crates/rusty-ai", "crates/rusty-app", "crates/rusty-embed", "crates/rusty-ui", "crates/rusty-ipc", "crates/rusty-term", "crates/rusty-edit", "crates/rusty-lsp", "crates/rusty-dbg"]
# Test fixtures are real, standalone workspaces that rusty-core analyzes at test
# time. They must not join this workspace or their deps would unify with ours
# and the numbers under test would drift with our own dependency changes.
exclude = ["crates/rusty-core/tests/fixtures"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
# Not MIT/Apache: this is source you may read, run and change, but not sell.
# `license-file` rather than `license` because PolyForm is not one of the SPDX
# identifiers cargo validates, and a wrong identifier is worse than none.
license-file = "LICENSE.md"
repository = "https://github.com/Linshiqi/rusty"
authors = ["rusty contributors"]

[workspace.lints.rust]
# Deny, not forbid: the built-in shell's console-mode FFI is the one
# sanctioned exception, opted in per module with a stated reason.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# rusty-core spends its time inside guppy/petgraph; unoptimized deps make
# `cargo test` on a real workspace unbearably slow.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
