[package]
name = "rusty-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rusty's installer and uninstaller for Windows"
publish = false

[[bin]]
name = "rusty-setup"
path = "src/main.rs"

[dependencies]
# The payload is one tar, compressed whole with xz: LZMA over the whole
# install, so the many near-identical files among the tools compress
# against each other — a third of what per-file deflate made of them.
tar = "0.4.46"
# liblzma itself, built from its own source (`static`) so no system copy is
# needed, with the multithreaded encoder and decoder (`parallel`). Without
# `bindgen`: the bindings are pregenerated, and a build needs no libclang.
liblzma = { version = "0.4.8", default-features = false, features = ["static", "parallel"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
rfd = "0.16.0"
# The installer's window, in the toolkit rusty's own is drawn with — but
# only the software renderer (with paths for the icons and the system's
# fonts for Chinese): a window this small needs no GPU, and the installer
# is also the uninstaller left on disk.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "software-renderer-systemfonts",
    "accessibility",
] }
# Photographs of each page (`RUSTY_SETUP_SHOTS=<dir>`), for looking at the
# window without clicking through it. A development build's only.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Which language the window speaks: the system's, Chinese or English.
sys-locale = "0.3.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[features]
shots = ["dep:image"]

[build-dependencies]
embed-resource = "3.0.11"
slint-build = "1.18.1"

[lints]
workspace = true
