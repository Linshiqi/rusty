[package]
name = "rusty-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rusty's desktop window, drawn with Slint"

[[bin]]
name = "rusty"
path = "src/main.rs"

[dependencies]
slint = "1.18.1"
rusty-core = { path = "../rusty-core" }
rusty-edit = { path = "../rusty-edit" }
rusty-embed = { path = "../rusty-embed" }
rusty-i18n = { path = "../rusty-i18n" }
rusty-lsp = { path = "../rusty-lsp" }
rfd = "0.16.0"
arboard = "3.6.1"
regex = "1.13.1"
sys-locale = "0.3.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"
toml = "1.1.4"

[lints]
workspace = true
