[package]
name = "rusty-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rusty's desktop window, drawn with Slint"

[[bin]]
name = "rusty"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
# An update on macOS is the app bundle as a .tar.gz, unpacked beside the
# running one and swapped for it.
tar = "0.4.46"
flate2 = "1.1.9"

[dependencies]
slint = "1.18.1"
# Slint's own core, for one thing only: the probe turns a mouse wheel the
# way winit hands one over (`RUSTY_PROBE_SCROLL_WHEEL`), animated, which the
# public `PointerScrolled` is not. Pinned to the version slint pins.
i-slint-core = { version = "=1.18.1", default-features = false }
rusty-ai = { path = "../rusty-ai" }
rusty-core = { path = "../rusty-core" }
rusty-dbg = { path = "../rusty-dbg" }
rusty-edit = { path = "../rusty-edit" }
rusty-embed = { path = "../rusty-embed" }
rusty-git = { path = "../rusty-git" }
rusty-i18n = { path = "../rusty-i18n" }
rusty-lsp = { path = "../rusty-lsp" }
rusty-term = { path = "../rusty-term" }
unicode-width = "0.2.2"
jiff = "0.2.35"
pulldown-cmark = { version = "0.13.4", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
rfd = "0.16.0"
arboard = "3.6.1"
regex = "1.13.1"
sys-locale = "0.3.2"
# A picture opened from the tree or named by a page, decoded here so a
# failure can say why. GIF, WebP and BMP reuse what resvg already compiles
# for Slint's SVGs; ICO is PNG and BMP in a directory.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Why an SVG would not load, in the parser's words: Slint's own error says
# only that it did not. The same usvg Slint draws SVGs with.
usvg = { version = "0.48.1", default-features = false }
# Formulas: RaTeX, KaTeX's layout in Rust, drawn to SVG with KaTeX's fonts
# embedded. Chosen by measuring every formula in a real book against
# latex-rust, typst with mitex and MathJax (docs/slint.md). Pinned: a layout
# engine's minor release can move every formula on every page.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"
# The icon of `rusty.exe` on Windows.
embed-resource = "3.0.11"
toml = "1.1.4"

[lints]
workspace = true
