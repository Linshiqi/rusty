needs-esp-title = "{chip} needs the `esp` toolchain"
needs-esp-detail = "This part is {arch} and upstream rustc cannot emit code for it. `rust-toolchain.toml` pins `{pinned}`, which will fail with an unknown-target error. The `esp` toolchain ships a forked LLVM and is installed by espup."
needs-esp-unpinned-title = "{chip} needs the `esp` toolchain, and none is pinned"
needs-esp-unpinned-detail = "Builds will use whatever toolchain happens to be default. Pin it so the project builds the same way on every machine."
esp-not-needed-title = "{chip} does not need the `esp` toolchain"
esp-not-needed-detail = "This part is {arch}, which stock Rust supports. Pinning `esp` still works but forces everyone building this project to install espup."
defmt-title = "defmt logging detected"
defmt-detail = "The monitor will decode frames against this build's ELF. Reflash after changing log strings or the decoding drifts."
xtensa-analyzer-blind-title = "Xtensa toolchain older than rust-analyzer expects"
xtensa-analyzer-blind-detail = "The esp toolchain’s cargo calls itself {version}, and rust-analyzer asks a cargo of that version for `--lockfile-path` — a flag cargo removed in 1.95. Every `cargo metadata` fails, so the dependency graph never loads: your own code still gets completion and navigation, while `esp_hal::` and every other crate answer nothing. The build is unaffected. Updating the toolchain moves the version past the boundary, and rust-analyzer then asks the way this cargo already understands."
xtensa-missing-title = "Xtensa toolchain missing"
xtensa-missing-detail = "{chip} is Xtensa, which upstream rustc cannot target. Without the `esp` toolchain the build fails with an unknown-target error that does not mention espup. Installing it takes a while — it downloads a forked LLVM."
target-not-installed-title = "Target `{target}` not installed"
nightly-missing-title = "Nightly Rust with its source missing"
nightly-missing-detail = "This part's target is a description the project carries, with no standard library rustup can add: cargo builds `core` for it from source, which only a nightly toolchain with the `rust-src` component can do."
nightly-not-pinned-title = "The project does not build with nightly"
nightly-not-pinned-detail = "It builds `core` itself (`build-std` in .cargo/config.toml), which stable cargo refuses, and nothing makes cargo use nightly here — no `rust-toolchain.toml`, and the default toolchain is not nightly. A `rust-toolchain.toml` with `channel = \"nightly\"` and `components = [\"rust-src\"]` pins it for everyone who clones the project; the command below pins it on this machine only."
target-not-installed-detail = "cargo will refuse to build for a target rustup has not added."
no-flasher-title = "No way to flash the board"
no-flasher-detail = "None of the tools that flash a {chip} is installed ({tools}). {tool} is the one it is usually flashed with."
pio-env-none-title = "No environment in platformio.ini"
pio-env-none-detail = "PlatformIO builds an [env:…] section, and this file declares none."
pio-chip-unknown-title = "The chip could not be read from platformio.ini"
pio-chip-unknown-detail = "Environment {env} names board {board}, which neither rusty's catalogue nor PlatformIO's installed boards describe as a part rusty knows. PlatformIO still builds and uploads it; rusty cannot size it against the part, flash it another way or simulate it. board_build.mcu in the environment names the part outright."
cmake-chip-unknown-title = "The chip could not be read from the CMake project"
cmake-chip-unknown-detail = "rusty reads the chip where the project's SDK writes it — the Pico SDK's PICO_BOARD, ESP-IDF's sdkconfig, STM32CubeMX's .ioc — or, with no SDK, in a `set(RUSTY_CHIP <part>)` line in CMakeLists.txt, and found none it knows in this {sdk} project. CMake still builds it; rusty cannot size it against the part, flash it or simulate it until it can tell which part it is."
build-tool-missing-title = "{tool} is not installed"
build-tool-missing-detail = "This is a {system} project, and building it runs {tool}, which is not on PATH."
c-compiler-missing-title = "{tool} is not installed"
