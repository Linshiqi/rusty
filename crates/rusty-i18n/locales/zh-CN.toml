chip-ambiguous-title = "目标芯片未知"
chip-ambiguous-detail = "这里没有芯片，而被排除的 crate 里不止一个有：{crates}。rusty 不会替你在它们之间做选择——把你要的那个作为项目打开。"
chip-unrecognised-title = "无法识别的芯片 `{chip}`"
chip-unrecognised-detail = "rusty 的目录里没有这颗芯片，所以针对芯片的检查会跳过。烧录和构建仍然可用。"
target-mismatch-title = "目标三元组和芯片对不上"
target-mismatch-detail = "`.cargo/config.toml` 构建的是 `{configured}`，但 {chip} 配 {runtime} 需要的是 `{expected}`。构建要么链接失败，要么产出一个给错核心的二进制。"
no-target-for-runtime-title = "{chip} 没有 {runtime} 的目标"
no-target-for-runtime-detail = "这颗芯片上没有受支持的 {runtime} Rust 目标。"
no-target-title = "没有配置目标"
no-target-detail = "`.cargo/config.toml` 里没有 `[build] target`，所以 cargo 会给本机构建，而不是给 {chip}。产物能编译通过，然后什么正事也干不了。"
needs-esp-title = "{chip} 需要 `esp` 工具链"
needs-esp-detail = "这颗芯片是 {arch}，上游 rustc 根本无法为它生成代码。`rust-toolchain.toml` 固定的是 `{pinned}`，构建会以「未知目标」错误失败。`esp` 工具链带的是分支 LLVM，由 espup 安装。"
needs-esp-unpinned-title = "{chip} 需要 `esp` 工具链，但没有固定任何工具链"
needs-esp-unpinned-detail = "构建会用当时碰巧是默认的那条工具链。固定它，项目在每台机器上才是同样的构建方式。"
esp-not-needed-title = "{chip} 不需要 `esp` 工具链"
esp-not-needed-detail = "这颗芯片是 {arch}，标准 Rust 就支持。固定 `esp` 仍然能用，但会逼着每个构建这个项目的人去装 espup。"
defmt-title = "检测到 defmt 日志"
defmt-detail = "监视器会按这次构建的 ELF 来解码帧。改了日志字符串之后要重新烧录，否则解码会对不上。"
xtensa-analyzer-blind-title = "Xtensa 工具链比 rust-analyzer 预期的旧"
xtensa-analyzer-blind-detail = "esp 工具链的 cargo 自称 {version}，rust-analyzer 就会向这个版本的 cargo 传 `--lockfile-path`——而 cargo 在 1.95 已经移除了这个参数。于是每次 `cargo metadata` 都失败，依赖图从来加载不了：你自己的代码仍然有补全和跳转，而 `esp_hal::` 以及其他所有 crate 都没有任何提示。构建不受影响。升级工具链会把版本号推过那个边界，rust-analyzer 就会改用这个 cargo 本来就认识的写法。"
xtensa-missing-title = "缺少 Xtensa 工具链"
xtensa-missing-detail = "{chip} 是 Xtensa，上游 rustc 无法以它为目标。没有 `esp` 工具链，构建会以一个压根不提 espup 的「未知目标」错误失败。安装要花一会儿——它要下载一份分支 LLVM。"
target-not-installed-title = "目标 `{target}` 未安装"
nightly-missing-title = "缺少带源码的 nightly Rust"
nightly-missing-detail = "这颗芯片的目标是项目自带的一份描述，rustup 没有现成的标准库可装：cargo 要从源码为它编译 `core`，这只有装了 `rust-src` 组件的 nightly 工具链能做到。"
nightly-not-pinned-title = "项目不是用 nightly 构建的"
nightly-not-pinned-detail = "它自己编译 `core`（.cargo/config.toml 里的 `build-std`），stable 的 cargo 会拒绝；而这里没有任何东西让 cargo 用 nightly——没有 `rust-toolchain.toml`，默认工具链也不是 nightly。写一个 `channel = \"nightly\"`、`components = [\"rust-src\"]` 的 `rust-toolchain.toml`，所有克隆这个项目的人都会用上它；下面的命令只在这台机器上生效。"
target-not-installed-detail = "rustup 没有添加过的目标，cargo 会拒绝为它构建。"
no-flasher-title = "没有办法烧录到板子"
no-flasher-detail = "能烧录 {chip} 的工具一个都没装（{tools}）。它通常用 {tool} 烧录。"
pio-env-none-title = "platformio.ini 里没有环境"
pio-env-none-detail = "PlatformIO 构建的是 [env:…] 段，这个文件一个都没写。"
pio-chip-unknown-title = "无法从 platformio.ini 读出芯片"
pio-chip-unknown-detail = "环境 {env} 用的板子是 {board}，rusty 的芯片目录和本机已装的 PlatformIO 板子描述都没把它对应到 rusty 认识的芯片。PlatformIO 照样能编译和上传；但 rusty 无法按芯片统计占用、用别的方式烧录或仿真。在环境里写上 board_build.mcu 就能直接指明芯片。"
cmake-chip-unknown-title = "无法从 CMake 工程读出芯片"
cmake-chip-unknown-detail = "rusty 只在工程所用 SDK 写芯片的地方读芯片——Pico SDK 的 PICO_BOARD、ESP-IDF 的 sdkconfig、STM32CubeMX 的 .ioc；没有 SDK 时读 CMakeLists.txt 里的 `set(RUSTY_CHIP <芯片>)`——在这个 {sdk} 工程里没找到它认识的。CMake 照样能编译；在认出是哪颗芯片之前，rusty 无法按芯片统计占用、烧录或仿真。"
build-tool-missing-title = "没有安装 {tool}"
build-tool-missing-detail = "这是 {system} 工程，构建要运行 {tool}，但它不在 PATH 上。"
c-compiler-missing-title = "没有安装 {tool}"
c-compiler-missing-detail = "这个 CMake 工程要用 {tool} 为 {chip} 编译，但它不在 PATH 上。"
ldproxy-missing-title = "缺少 ldproxy"
ldproxy-missing-detail = "ESP-IDF（std）构建是通过 ldproxy 链接的。没有它，构建会在链接阶段以「找不到链接器」失败。"
