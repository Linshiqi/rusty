[problem]
chip-in-firmware-title = "芯片在固件 crate 里"
chip-in-firmware-detail = "这个目录本身没有芯片——它是一个工作区，固件被排除在外。芯片在 {crates}，rusty 也就在那里构建、烧录和仿真。没有任何东西坏掉；只是这一行填不出来。"
chip-none-title = "目标芯片未知"
chip-none-detail = "既没有 `esp-hal` 的芯片特性，也没有可识别的目标三元组。没有芯片，rusty 就无法选工具链、无法烧录、也无法计算体积。"
chip-ambiguous-title = "目标芯片未知"
chip-ambiguous-detail = "这里没有芯片，而被排除的 crate 里不止一个有：{crates}。rusty 不会替你在它们之间做选择——把你要的那个作为项目打开。"
chip-unrecognised-title = "无法识别的芯片 `{chip}`"
chip-unrecognised-detail = "rusty 的目录里没有这颗芯片，所以针对芯片的检查会跳过。烧录和构建仍然可用。"
target-mismatch-title = "目标三元组和芯片对不上"
target-mismatch-detail = "`.cargo/config.toml` 构建的是 `{configured}`，但 {chip} 配 {runtime} 需要的是 `{expected}`。构建要么链接失败，要么产出一个给错核心的二进制。"
no-target-for-runtime-title = "{chip} 没有 {runtime} 的目标"
no-target-for-runtime-detail = "这颗芯片上没有受支持的 {runtime} Rust 目标。"
no-target-title = "没有配置目标"
no-target-detail = "`.cargo/config.toml` 里没有 `[build] target`，所以 cargo 会给本机构建，而不是给 {chip}。产物能编译通过，然后什么正事也干不了。"
needs-esp-title = "{chip} 需要 `esp` 工具链"
needs-esp-detail = "这颗芯片是 {arch}，上游 rustc 根本无法为它生成代码。`rust-toolchain.toml` 固定的是 `{pinned}`，构建会以「未知目标」错误失败。`esp` 工具链带的是分支 LLVM，由 espup 安装。"
needs-esp-unpinned-title = "{chip} 需要 `esp` 工具链，但没有固定任何工具链"
needs-esp-unpinned-detail = "构建会用当时碰巧是默认的那条工具链。固定它，项目在每台机器上才是同样的构建方式。"
esp-not-needed-title = "{chip} 不需要 `esp` 工具链"
esp-not-needed-detail = "这颗芯片是 {arch}，标准 Rust 就支持。固定 `esp` 仍然能用，但会逼着每个构建这个项目的人去装 espup。"
defmt-title = "检测到 defmt 日志"
defmt-detail = "监视器会按这次构建的 ELF 来解码帧。改了日志字符串之后要重新烧录，否则解码会对不上。"
xtensa-missing-title = "缺少 Xtensa 工具链"
xtensa-missing-detail = "{chip} 是 Xtensa，上游 rustc 无法以它为目标。没有 `esp` 工具链，构建会以一个压根不提 espup 的「未知目标」错误失败。安装要花一会儿——它要下载一份分支 LLVM。"
target-not-installed-title = "目标 `{target}` 未安装"
target-not-installed-detail = "rustup 没有添加过的目标，cargo 会拒绝为它构建。"
no-flasher-title = "没有办法烧录到板子"
no-flasher-detail = "espflash 和 probe-rs 都没装。espflash 更省事——只要一根 USB 线。probe-rs 多了断点调试和 RTT 上的 defmt，但要一个调试器。"
ldproxy-missing-title = "缺少 ldproxy"
ldproxy-missing-detail = "ESP-IDF（std）构建是通过 ldproxy 链接的。没有它，构建会在链接阶段以「找不到链接器」失败。"
