# 简体中文。
#
# 三条翻译约定，每一条都是为了避免一类具体的错误：
#
# 1. 命令行、工具名、芯片 id、目标三元组一律保留原文 —— 用户要照着敲、
#    要搜索、要贴进 issue 里。测试 `no_catalogue_translates_a_command_or_
#    a_triple` 会检查这一点。
# 2. 涉及"会烧错固件""会编到本机去"这类后果的句子，宁可长一点也要把后果
#    说清楚。这类文案存在的意义就是拦住一个具体的错误。
# 3. 中英混排时，英文词与中文之间不加空格 —— 界面里 `cargo` 这类词出现
#    频率很高，加空格会让整段文字看起来是断的。

