[package]
name = "rusty-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# How a child is spawned, where the homes are and where rustfmt is: one
# rule for every crate.
rusty-spawn = { path = "../rusty-spawn" }
# Reading and writing a file in the encoding it was written in — a vendor
# SDK's GBK, a Windows tool's UTF-16 (`text_file`).
encoding_rs = "0.8.35"
serde = { version = "1.0.229", features = ["derive"] }

# Sublime grammars, bundled — highlighting works offline and needs no npm.
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
    "parsing",
] }
# ripgrep's walker, so `target/` and anything else .gitignore names is skipped
# without this crate having to guess what is build output.
ignore = "0.4.33"
# ripgrep's matcher and searcher — the other half of "why is ripgrep fast":
# SIMD literal search, Unicode case folding, -w word mode, binary detection.
# Replace runs on the same matcher: grep-matcher's `Captures::interpolate` is
# what gives `$1` its meaning, so no second regex engine is needed — and a
# second engine is how search and replace came to disagree about `<`.
grep-matcher = "0.1.7"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
thiserror = "2.0.20"
# A manifest's targets named by `path` are roots of their crate, which the
# module scan must know before it calls any file unlinked (`modules`).
toml = "1.1.4"
# Platform file watching — ReadDirectoryChangesW, FSEvents, inotify. The
# workbench is never the only thing writing to a checkout, and until this the
# window showed whatever it read when the project was opened.
notify = "8.0.0"
# The tree's Delete goes to the recycle bin, never `remove_dir_all`: a
# right-click is not a place to lose a directory for ever.
trash = "5.2.9"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
