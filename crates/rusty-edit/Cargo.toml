[package]
name = "rusty-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The tree and the highlighted document are drawn by the frontend, so the
# unconditional half of this crate must compile to wasm32.
serde = { version = "1.0.229", features = ["derive"] }

# Sublime grammars, bundled — highlighting works offline and needs no npm.
syntect = { version = "5.3.0", optional = true, default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
    "parsing",
] }
# ripgrep's walker, so `target/` and anything else .gitignore names is skipped
# without this crate having to guess what is build output.
ignore = { version = "0.4.33", optional = true }
# ripgrep's matcher and searcher — the other half of "why is ripgrep fast":
# SIMD literal search, Unicode case folding, -w word mode, binary detection.
grep-matcher = { version = "0.1.7", optional = true }
grep-regex = { version = "0.1.14", optional = true }
grep-searcher = { version = "0.1.17", optional = true }
thiserror = { version = "2.0.20", optional = true }

[features]
default = ["backend"]
backend = ["dep:syntect", "dep:ignore", "dep:grep-matcher", "dep:grep-regex", "dep:grep-searcher", "dep:thiserror"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
