[package]
name = "ch32x035pwm"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal", rev = "5f0e963e4074fd3335902c79cc9c0fa342e39606", features = [
    "ch32x035f8u6",
    "memory-x",
    "rt",
] }
qingke = "0.8"
qingke-rt = "0.8"
panic-halt = "1.0"

[profile.release]
strip = false
lto = true
opt-level = "z"

[profile.dev]
overflow-checks = false
