[package]
name = "ch32pwm"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal", features = [
    "ch32v003j4m6",
    "memory-x",
    "rt",
] }
qingke = "0.8"
qingke-rt = { version = "0.8", features = ["highcode"] }
panic-halt = "1.0"

[profile.release]
strip = false
lto = true
opt-level = "z"

[profile.dev]
overflow-checks = false
