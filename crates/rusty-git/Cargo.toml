[package]
name = "rusty-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# How a child is spawned: one rule for every crate.
rusty-spawn = { path = "../rusty-spawn" }
serde = { version = "1.0.229", features = ["derive"] }

# The repository side: running `git` and reading what it says. Same major as
# every other crate here.
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
