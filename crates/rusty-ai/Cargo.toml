[package]
name = "rusty-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

async-stream = "0.3.6"
async-trait = "0.1.92"
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
keyring = "4.1.6"
# `socks`: the workbench's proxy setting is whatever the user typed or the
# system reports, and `socks5://` is a common answer on the machines that need
# a proxy at all. Without the feature that URL is a build error naming the
# proxy, not a working route.
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "socks"] }
thiserror = "2.0.20"
# `time`: the timeouts and the one retry's pause in `http`.
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }

rusty-core = { path = "../rusty-core" }
rusty-embed = { path = "../rusty-embed" }
# The project's files as the Files panel sees them — confined to the root,
# .gitignore honoured — for the read/search/list tools.
rusty-edit = { path = "../rusty-edit" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
