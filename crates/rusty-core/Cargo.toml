[package]
name = "rusty-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# How a child is spawned and where the homes are: one rule for every crate.
rusty-spawn = { path = "../rusty-spawn" }
serde = { version = "1.0.229", features = ["derive"] }

camino = "1.2.5"
guppy = "0.17.26"
semver = "1.0.28"
serde_json = "1.0.151"
thiserror = "2.0.20"
# The crates.io sparse index, for the Crates panel's "latest" column.
ureq = "3.4.0"
# Volume free space and the `.cargo-lock` probe behind the Disk view.
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[lints]
workspace = true
