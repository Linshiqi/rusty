[package]
name = "rusty-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The chip catalogue and the wire types are rendered by the frontend, so the
# unconditional half of this crate must compile to wasm32.
serde = { version = "1.0.229", features = ["derive"] }

toml = { version = "1.1.4", optional = true }
# In-process downloads for tool installs: rustls instead of the OS TLS —
# Windows schannel aborts on some CDNs — and a mirror can be tried in turn.
ureq = { version = "3.4.0", optional = true, features = ["socks-proxy"] }
# Two fields out of GitHub's release answer. Already in the tree via the
# frontend and the CLI, so this costs nothing a build did not already pay.
serde_json = { version = "1.0.151", optional = true }
# SVD is XML. Already in the tree via tauri, so this adds no crate to the
# build — and hand-rolling an XML reader for vendor files is how a register
# view ends up wrong about the one chip nobody tested.
quick-xml = { version = "0.41.0", optional = true }
thiserror = { version = "2.0.20", optional = true }
object = { version = "0.40.0", optional = true }
rustc-demangle = { version = "0.1.28", optional = true }
# `libudev` is what supplies USB vendor/product ids on Linux, which is how a
# dev board is told apart from a modem. It costs a system library at build
# time; the default feature set keeps it, and a packager who cannot have it can
# turn it off and lose only the board-name guess.
serialport = { version = "4.9.0", optional = true }

# Finding Visual Studio's `link.exe` the way rustc does, so the Toolchain
# panel cannot call a linker missing that rustc would use. Already in the
# tree through a dozen build scripts.
[target.'cfg(windows)'.dependencies]
cc = { version = "1.4", optional = true }

[features]
default = ["backend"]
backend = [
    "dep:toml",
    "dep:ureq", "dep:thiserror", "dep:serde_json", "dep:quick-xml",
    "dep:object",
    "dep:rustc-demangle",
    "dep:serialport",
    "dep:cc",
]

[lints]
workspace = true

[dev-dependencies]
object = { version = "0.40.0", features = ["write"] }
tempfile = "3.27.0"
