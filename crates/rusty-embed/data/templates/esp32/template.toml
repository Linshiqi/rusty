# The ESP32's proven project: qemu/esp32-probe's, which the emulator's
# gate 16 boots.

chip = "esp32"
playground = 2

[[file]]
path = "Cargo.toml"
from = "Cargo.toml.in"

[[file]]
path = "Cargo.lock"
from = "Cargo.lock.in"

[[file]]
path = "build.rs"
from = "../build.rs.in"

[[file]]
path = "rust-toolchain.toml"
from = "rust-toolchain.toml.in"

[[file]]
path = ".cargo/config.toml"
from = "cargo-config.toml.in"

[[file]]
path = "src/main.rs"
from = "main.rs.in"

[[file]]
path = ".rusty/sim.toml"
from = "sim.toml.in"
