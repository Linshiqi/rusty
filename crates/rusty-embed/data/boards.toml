[[board]]
id = "esp32s3-devkitc-1"
name = "ESP32-S3-DevKitC-1"
chip = "esp32s3"
flash_bytes = 8_388_608
psram_bytes = 8_388_608
[[board.usb]]
vendor_id = 0x303A
product_id = 0x1001
note = "native USB (USB socket)"
[[board.usb]]
vendor_id = 0x10C4
product_id = 0xEA60
note = "CP210x bridge (UART socket)"
[board.pins]
led = 48

[[board]]
id = "esp32-devkitc-v4"
name = "ESP32-DevKitC V4"
