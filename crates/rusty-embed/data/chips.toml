# The part catalogue.
#
# Embedded into the binary at build time, and the schema a user's own file must
# follow. Everything here is a property of the die; anything that depends on the
# module or the board around it — flash size, USB ids, pin names — belongs in
# boards.toml.
#
# `sram_bytes` is datasheet headline capacity. It is not what the linker will
# grant you: the ROM bootloader and the cache configuration both take a share.
# The memory dashboard reads real regions from the ELF and uses this only as
# context.

# ── Espressif ────────────────────────────────────────────────────────────────

[[chip]]
id = "esp32"
name = "ESP32"
vendor = "espressif"
arch = "xtensa"
cores = 2
sram_bytes = 532_480
bare_metal_target = "xtensa-esp32-none-elf"
std_target = "xtensa-esp32-espidf"
toolchain = "esp-xtensa"
flashers = ["espflash", "probe-rs"]
probe_rs_target = "esp32"
radios = ["Wi-Fi 4", "Bluetooth Classic", "BLE"]

