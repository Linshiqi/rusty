# ── ST: a seam, not coverage ─────────────────────────────────────────────────
#
# These two exist so the vendor abstraction is exercised by something rather
# than being a single-implementation interface that quietly assumes Espressif
# everywhere. Extending the range is a matter of adding entries here.
#
# `probe_rs_target` is deliberately absent: probe-rs names STM32 parts by
# package and flash size, which the die alone does not determine. Guessing one
# produces a plausible name with the wrong memory map, so rusty asks the user to
# run `probe-rs chip list` instead.

[[chip]]
id = "stm32f103"
name = "STM32F103 (Blue Pill)"
vendor = "st"
arch = "cortex-m"
cores = 1
sram_bytes = 20_480
flash_bytes = 65_536
bare_metal_target = "thumbv7m-none-eabi"
toolchain = "stock"
# No serial bootloader, so a probe is the only way in.
flashers = ["probe-rs"]
radios = ["none"]

[[chip]]
id = "stm32f411"
name = "STM32F411"
vendor = "st"
arch = "cortex-m"
cores = 1
sram_bytes = 131_072
flash_bytes = 524_288
# The `hf` suffix matters: this part has a hardware FPU, and building for the
# soft-float target silently costs performance.
bare_metal_target = "thumbv7em-none-eabihf"
toolchain = "stock"
flashers = ["probe-rs"]
radios = ["none"]
