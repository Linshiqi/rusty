ports = { width = 16 }
generator = { template = "stm32f411ce" }
# The ordering code a .ioc or a platformio.ini names the part by.
aliases = ["stm32f401ccu6", "stm32f401ccux"]
gdb = "arm-none-eabi-gdb"
c_compiler = { binary = "arm-none-eabi-gcc", install = "download the Arm GNU Toolchain (AArch32 bare-metal, arm-none-eabi) from https://developer.arm.com/downloads/-/arm-gnu-toolchain-downloads and put its bin/ on PATH", flags = "-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16" }
