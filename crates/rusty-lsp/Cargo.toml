[package]
name = "rusty-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Diagnostics, completions and locations are drawn by the frontend, so the
# unconditional half of this crate must compile to wasm32.
serde = { version = "1.0.229", features = ["derive"] }

serde_json = { version = "1.0.151", optional = true }
thiserror = { version = "2.0.20", optional = true }
# Only to read `workspace.exclude` out of the root manifest, so a firmware
# crate the workspace deliberately leaves out still gets IDE services. Hand
# parsing that key is the kind of thing that silently gets it wrong.
toml = { version = "1.1.4", optional = true }

[features]
default = ["backend"]
backend = ["dep:serde_json", "dep:thiserror", "dep:toml"]

# The probes and the end-to-end test all start a real rust-analyzer, so they
# need the half of this crate that spawns one. Without this, `--all-targets`
# builds them with default features off and stops on a missing `LspClient`.
[[example]]
name = "probe"
required-features = ["backend"]

[[example]]
name = "diag_probe"
required-features = ["backend"]

[[example]]
name = "complete_probe"
required-features = ["backend"]

[[test]]
name = "analyzer"
required-features = ["backend"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
