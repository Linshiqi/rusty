[package]
name = "rusty-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Diagnostics, completions and locations are drawn by the frontend, so the
# unconditional half of this crate must compile to wasm32.
serde = { version = "1.0.229", features = ["derive"] }

serde_json = { version = "1.0.151", optional = true }
thiserror = { version = "2.0.20", optional = true }

[features]
default = ["backend"]
backend = ["dep:serde_json", "dep:thiserror"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
