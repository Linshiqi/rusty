[package]
name = "rusty-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# How a child is spawned and where a rustup component is: one rule for
# every crate.
rusty-spawn = { path = "../rusty-spawn" }
serde = { version = "1.0.229", features = ["derive"] }

serde_json = "1.0.151"
thiserror = "2.0.20"
# Only to read `workspace.exclude` out of the root manifest, so a firmware
# crate the workspace deliberately leaves out still gets IDE services. Hand
# parsing that key is the kind of thing that silently gets it wrong.
toml = "1.1.4"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
