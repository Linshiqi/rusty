[package]
name = "rusty-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.104"
leptos = { version = "0.8.20", features = ["csr"] }
rusty-ai = { version = "0.1.0", path = "../rusty-ai", default-features = false }
rusty-core = { version = "0.1.0", path = "../rusty-core", default-features = false }
rusty-edit = { version = "0.1.0", path = "../rusty-edit", default-features = false }
rusty-embed = { version = "0.1.0", path = "../rusty-embed", default-features = false }
rusty-ipc = { version = "0.1.0", path = "../rusty-ipc" }
rusty-term = { version = "0.1.0", path = "../rusty-term", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.151"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "MediaQueryList", "KeyboardEvent", "HtmlInputElement", "HtmlSelectElement", "DomTokenList", "CssStyleDeclaration", "Navigator", "Clipboard", "HtmlSpanElement", "HtmlDivElement", "HtmlTextAreaElement", "DomRect", "ClipboardEvent", "DataTransfer", "WheelEvent", "ResizeObserver", "ResizeObserverEntry"] }

[lints]
workspace = true
