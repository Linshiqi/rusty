[package]
name = "rusty-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Packs and signs rusty's release artifacts for the release workflow"
publish = false

[dependencies]
rusty-setup = { path = "../rusty-setup" }
# The updater's own signature check, run on every artifact before upload.
rusty-embed = { path = "../rusty-embed" }
# Signs each download with the updater key; base64 because a CI secret may
# hold the key file that way.
minisign = "0.9"
base64 = "0.22.1"

[lints]
workspace = true
