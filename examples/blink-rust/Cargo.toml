# `[workspace]` on its own detaches this from rusty's workspace. Without it
# cargo refuses to build anything under a workspace root it is not a member
# of, with an error about believing it is in a workspace.
[workspace]

[package]
edition = "2024"
name    = "blink-rust"
version = "0.1.0"

[[bin]]
name = "blink-rust"
path = "./src/main.rs"

[dependencies]
esp-hal                = { version = "~1.1.0", features = ["esp32c3", "unstable"] }
esp-println            = { version = "0.15", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
critical-section       = "1.2.0"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
