# `[workspace]` on its own detaches this from rusty's workspace, exactly as
# the examples do — cargo otherwise refuses to build under a workspace root
# it is not a member of.
[workspace]

[package]
edition = "2024"
name    = "display-probe"
version = "0.1.0"

[[bin]]
name = "display-probe"
path = "./src/main.rs"

[dependencies]
esp-hal                = { version = "~1.1.0", features = ["esp32c3", "unstable"] }
esp-println            = { version = "0.15", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
# A real driver and a real graphics library, on purpose: what has to be
# proven is that the bytes *somebody else's* code sends decode into the
# picture it drew. A hand-written init sequence would only prove that the
# decoder reads the sequence this file wrote.
ssd1306            = "0.10"
embedded-graphics  = "0.8"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
