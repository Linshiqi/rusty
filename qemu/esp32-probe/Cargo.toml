# `[workspace]` on its own detaches this from rusty's workspace, exactly as
# the other probes do.
[workspace]

[package]
edition = "2024"
name    = "esp32-probe"
version = "0.1.0"

[[bin]]
name = "esp32-probe"
path = "./src/main.rs"

[dependencies]
esp-hal                = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-println            = { version = "0.15", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
critical-section       = "1.2.0"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
