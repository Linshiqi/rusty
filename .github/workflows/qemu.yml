# Build Espressif's QEMU with a GPIO that keeps its state.
#
# Run from the Actions tab. It clones espressif/qemu at the tag rusty pins,
# replaces the GPIO device model with the one in `qemu/`, builds only the two
# targets this workbench uses, and uploads the binaries.
#
# Why replacement files rather than a patch: the model being replaced is a
# stub, so almost every line changes, and a unified diff's line numbers would
# be the fragile part of an otherwise simple substitution. The checksums do
# the job a patch's context would — if upstream edits the file, the run stops
# and says so rather than quietly discarding their change.
#
# Not part of a release: the binaries are artifacts to test with. Shipping
# them means committing to rebuilding a QEMU fork for three desktops on every
# upstream bump, and that decision comes after the model is proven.

name: qemu

on:
  # Changing the model should compile it. The build is twenty minutes of a
  # free runner and the alternative is finding out later.
  push:
    paths:
      - "qemu/**"
      - ".github/workflows/qemu.yml"
  workflow_dispatch:
    inputs:
      targets:
        description: "QEMU targets to build"
        default: "riscv32-softmmu"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # QEMU's own list for a minimal softmmu build. Slirp is what gives the
      # guest a network without root, and pixman is needed even headless.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev \
            libslirp-dev python3-venv flex bison

      # The tag rusty pins, read from the source rather than repeated here —
      # two copies of a version is one that goes stale.
      - name: Read the pinned QEMU release
        id: pin
        run: |
          # `grep | cut`, not `grep -oP`: PCRE is unavailable under some
          # locales, and a step that fails for *that* reason costs a whole
          # twenty-minute round trip to find out about.
          tag=$(grep 'QEMU_RELEASE: &str' crates/rusty-embed/src/simulate.rs | cut -d'"' -f2)
          if [ -z "$tag" ]; then
            echo "::error::could not read QEMU_RELEASE from simulate.rs"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building against $tag"

      - name: Clone espressif/qemu
        run: |
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            https://github.com/espressif/qemu.git qemu-src

      # The check a patch would have done. If Espressif has edited either
      # file since these were written, the substitution would silently drop
      # their change — so stop, and make somebody read the new source.
      - name: Verify the upstream files are the ones this was written against
        working-directory: qemu-src
        run: |
          if ! sha256sum -c ../qemu/upstream.sha256; then
            echo "::error::espressif/qemu's GPIO model has changed since qemu/*.c was written."
            echo "Re-read hw/gpio/esp32_gpio.c upstream, fold in the change, and update qemu/upstream.sha256."
            exit 1
          fi

      - name: Install the GPIO model
        run: |
          cp qemu/esp32_gpio.c qemu-src/hw/gpio/esp32_gpio.c
          cp qemu/esp32_gpio.h qemu-src/include/hw/gpio/esp32_gpio.h

      - name: Configure
        working-directory: qemu-src
        run: |
          ./configure \
            --target-list="${{ inputs.targets || 'riscv32-softmmu' }}" \
            --enable-slirp \
            --disable-docs \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-werror

      - name: Build
        working-directory: qemu-src
        run: ninja -C build

      # Proof the binary contains *our* model and not the stub it replaced.
      #
      # By string rather than by `-device help`: `esp32.gpio` is a sysbus
      # device and may not be user-creatable, so a help probe can come back
      # empty for reasons that have nothing to do with whether the code is
      # in there. The report format is a literal only this file has.
      #
      # Fatal, not a warning. The first version of this step could not fail,
      # which made a green run mean nothing — the same tautology this
      # project has already caught itself writing in a test.
      - name: Prove the built binary carries this model
        working-directory: qemu-src
        run: |
          # `grep -a` rather than `strings`: macOS's strings reads only the
          # text section by default, so it misses a literal that lives in
          # __cstring — it reported this model absent from a binary that had
          # built perfectly. One method across all three jobs, since this is
          # one question.
          if LC_ALL=C grep -aq '\[rusty:gpio@' build/qemu-system-riscv32; then
            echo "the GPIO model is compiled in"
          else
            echo "::error::built QEMU does not contain the replacement model —"
            echo "the copy step or the build picked up the stub instead."
            exit 1
          fi

      # The test that matters: boot real firmware and see whether writing a
      # pin produces a line. `examples/blink-rust` is the ideal subject
      # because it drives GPIO0 *and* prints `[rusty:gpio]` itself — two
      # independent accounts of the same pin, so they can be checked against
      # each other rather than either being taken on trust.
      - name: Rust for the target
        run: rustup target add riscv32imc-unknown-none-elf

      # The action first: `cargo binstall` is not a command a runner has, and
      # the release workflow installs it the same way. Building espflash from
      # source is the fallback rather than the default — it is minutes of
      # compiling for a tool that publishes binaries.
      - uses: cargo-bins/cargo-binstall@main

      - name: espflash, for the flash image
        run: cargo binstall --no-confirm espflash || cargo install --locked espflash

      - name: Build blinky and make its image
        working-directory: examples/blink-rust
        run: |
          cargo build --release
          mkdir -p target/sim
          espflash save-image --chip esp32c3 --merge \
            target/riscv32imc-unknown-none-elf/release/blink-rust \
            target/sim/flash.bin

      # `-global`, because the machine creates the GPIO device — there is no
      # `-device` line to hang a chardev off. If this is the wrong way to
      # reach a machine-created device's property, the run says so here
      # rather than by silently producing an empty file.
      - name: Boot it and watch the pins
        working-directory: qemu-src
        run: |
          image=../examples/blink-rust/target/sim/flash.bin
          timeout 25 ./build/qemu-system-riscv32 \
            -M esp32c3 -nographic \
            -drive "file=$image,if=mtd,format=raw" \
            -serial file:serial.log \
            -chardev file,id=pins,path=pins.log \
            -global driver=esp32.gpio,property=pins,value=pins \
            > qemu.out 2>&1 || true

          echo "─── the pin channel ───"
          head -20 pins.log 2>/dev/null || echo "(no pins.log at all)"
          echo "─── what the firmware said ───"
          grep -m5 'rusty:gpio' serial.log 2>/dev/null || echo "(no firmware report)"
          echo "─── qemu's own output ───"
          head -10 qemu.out

      # Refuse to call this proven on a file that exists but is empty — the
      # exact shape of the release that shipped no installer.
      - name: The pin channel carried something
        working-directory: qemu-src
        run: |
          if [ ! -s pins.log ]; then
            echo "::error::the GPIO chardev produced nothing. Either -global is"
            echo "the wrong way to reach a machine-created device, or the model"
            echo "is not seeing the writes esp-hal makes."
            exit 1
          fi
          lines=$(grep -c 'rusty:gpio@' pins.log || echo 0)
          echo "$lines pin reports from the emulator itself"
          [ "$lines" -gt 0 ]

      # The check the two accounts exist for. A line arriving proves the
      # channel works; it does not prove the *level* is right, and a model
      # that reported a stuck 1 would pass everything above.
      #
      # blinky toggles GPIO0, so the emulator's own account must alternate,
      # and it must agree with what the firmware printed about the same pin.
      - name: The emulator and the firmware agree about GPIO0
        working-directory: qemu-src
        shell: python
        run: |
          import re, sys

          def levels(path):
              out = []
              try:
                  text = open(path, encoding="utf-8", errors="replace").read()
              except OSError:
                  return out
              for line in text.splitlines():
                  if "rusty:gpio" not in line:
                      continue
                  found = re.search(r"\b0=([01])\b", line)
                  if found:
                      out.append(int(found.group(1)))
              return out

          emulator = levels("pins.log")
          firmware = levels("serial.log")
          print("emulator :", emulator[:12])
          print("firmware :", firmware[:12])

          def stop(why):
              """Fail with the evidence attached.

              An `::error::` becomes an annotation, which survives the run and
              is readable without access to the logs. `sys.exit(msg)` writes to
              stderr, which is neither — the first version of this step failed
              with nothing but "exit code 1" to show for it.
              """
              print(f"::error::{why} | emulator={emulator[:12]} firmware={firmware[:12]}")
              sys.exit(1)

          if len(emulator) < 4:
              stop(f"the emulator reported GPIO0 only {len(emulator)} times; "
                   "blinky toggles it, so the model is missing writes")

          # Consecutive repeats mean a write was seen but the level was
          # computed wrong — a stuck pin reported over and over.
          if any(a == b for a, b in zip(emulator, emulator[1:])):
              stop("the emulator's GPIO0 does not alternate")

          # The firmware's own report is the second opinion. If it never
          # arrived the comparison cannot be made, and saying so is better
          # than passing on one source.
          if not firmware:
              stop("the firmware printed no GPIO report, so there is "
                   "nothing to check the emulator against")

          # The two do not start together, and should not. `Output::new` sets
          # the pin's direction and initial level *before* the loop that does
          # the printing, so the emulator legitimately knows about transitions
          # the firmware never announced. Demanding they agree on element zero
          # was the first version of this check, and it rejected a model that
          # was working — for being more truthful than the firmware.
          #
          # The real property: everything the firmware did announce appears in
          # the emulator's account, in order, after a short lead.
          offset = None
          for lead in range(4):
              overlap = min(len(emulator) - lead, len(firmware), 8)
              if overlap >= 4 and emulator[lead:lead + overlap] == firmware[:overlap]:
                  offset = lead
                  break

          if offset is None:
              stop("the emulator's account does not contain the firmware's")

          print(f"both accounts of GPIO0 agree, the emulator leading by {offset} "
                "— the pin being configured, which the firmware never printed")

      # Everything above proves the *output* half: the guest drove a pin and
      # the model saw it. The input half — a host driving a level that
      # unmodified firmware reads through GPIO_IN — has no witness in blinky,
      # which never reads a pin. Claiming it works because the code is there
      # is the same unproven claim this project keeps catching itself making.
      #
      # `qemu/gpio-probe` is the witness: it configures GPIO4 as an ordinary
      # input and prints the level on change. It knows nothing about the
      # simulator.
      - name: Build the input probe and make its image
        working-directory: qemu/gpio-probe
        run: |
          cargo build --release
          mkdir -p target/sim
          espflash save-image --chip esp32c3 --merge \
            target/riscv32imc-unknown-none-elf/release/gpio-probe \
            target/sim/flash.bin

      # A socket chardev, not a file: this direction needs somebody able to
      # write, and `-chardev file` is one-way.
      - name: A host-driven pin reaches the firmware's is_high()
        working-directory: qemu-src
        shell: python
        run: |
          import re, socket, subprocess, sys, time

          IMAGE = "../qemu/gpio-probe/target/sim/flash.bin"
          SERIAL = "probe-serial.log"
          PORT = 5555

          def read():
              try:
                  return open(SERIAL, encoding="utf-8", errors="replace").read()
              except OSError:
                  return ""

          def levels():
              """Every level the firmware printed, in order.

              It prints on *change*, so this is the transition sequence — and
              comparing a sequence is what lets the second half of the test
              fail distinctly. Waiting for the string "gpio4=0" a second time
              would match the first occurrence and pass without the pin ever
              having come back down.
              """
              return [int(m) for m in re.findall(r"\[probe\] gpio4=([01])", read())]

          def stop(why):
              print(f"::error::{why} | levels={levels()}")
              print("--- serial ---")
              print(read()[-1500:])
              sys.exit(1)

          def settle(count, seconds, why):
              deadline = time.time() + seconds
              while time.time() < deadline:
                  if len(levels()) >= count:
                      return
                  time.sleep(0.25)
              stop(why)

          qemu = subprocess.Popen(
              [
                  "./build/qemu-system-riscv32", "-M", "esp32c3", "-nographic",
                  "-drive", f"file={IMAGE},if=mtd,format=raw",
                  "-serial", f"file:{SERIAL}",
                  "-chardev",
                  f"socket,id=pins,host=127.0.0.1,port={PORT},server=on,wait=off",
                  "-global", "driver=esp32.gpio,property=pins,value=pins",
              ],
              stdout=open("probe-qemu.out", "w"), stderr=subprocess.STDOUT,
          )
          try:
              settle(1, 60, "the probe never reported GPIO4 at all — it did not "
                            "boot, or reading GPIO_IN does not come back")
              print(f"booted, GPIO4 reads {levels()[0]}")

              link = socket.create_connection(("127.0.0.1", PORT), timeout=15)

              link.sendall(b"4=1\n")
              settle(2, 25, "the host drove GPIO4 high and the firmware never "
                            "saw it — the input half does not reach GPIO_IN")

              # Back down, because a model that ORed every write into `in`
              # would have passed everything above this line.
              link.sendall(b"4=0\n")
              settle(3, 25, "GPIO4 went high and would not come back down — "
                            "the model sets bits but never clears them")

              seen = levels()[:3]
              if seen != [0, 1, 0]:
                  stop(f"expected the pin to read 0, then 1, then 0; got {seen}")
              print("0 → 1 → 0, driven from the host and read through GPIO_IN")
          finally:
              qemu.kill()

      - uses: actions/upload-artifact@v4
        # Especially on failure: the logs are the evidence for whatever the
        # comparison above rejected, and a step that only runs when the run
        # succeeded throws them away exactly when they are needed.
        if: always()
        with:
          name: pin-logs
          path: |
            qemu-src/pins.log
            qemu-src/serial.log
            qemu-src/probe-serial.log
            qemu-src/probe-qemu.out
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-linux-x86_64
          path: |
            qemu-src/build/qemu-system-riscv32
            qemu-src/build/pc-bios/**
          if-no-files-found: error

  # Does the same thing build on the other two desktops?
  #
  # Only that. Shipping our own QEMU means committing to rebuilding it for
  # three platforms on every upstream bump, and that is not a commitment worth
  # discussing before knowing whether the build even works — so this job
  # answers the one unknown and promises nothing.
  #
  # A separate job rather than a matrix over `build`, deliberately: `build` is
  # green and every gate in it has been read. Turning it into a matrix would
  # put the proven path at the mercy of three platforms' setup, and the first
  # red run would be about a runner rather than about the model.
  #
  # The behavioural gates stay on Linux for the same reason. The model is one
  # file of portable C; what differs here is glib, pixman and ninja, not
  # `s->out |= word`. Booting firmware on three platforms would mostly test
  # whether espflash and a TCP port behave the same everywhere, and a failure
  # in *that* says nothing about whether QEMU compiles.
  portability:
    name: builds on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            shell: bash
          - os: windows-latest
            name: Windows
            # QEMU on Windows builds under MSYS2's mingw64 — the same route
            # upstream documents, and the reason every step below has to run
            # in that shell rather than in PowerShell.
            shell: "msys2 {0}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # Before any `run` step: the shell default above applies to all of them,
      # so on Windows there is no shell to run in until this has set one up.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git binutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-python

      - name: Build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config glib pixman libslirp

      - name: Read the pinned QEMU release
        id: pin
        run: |
          tag=$(grep 'QEMU_RELEASE: &str' crates/rusty-embed/src/simulate.rs | cut -d'"' -f2)
          if [ -z "$tag" ]; then
            echo "::error::could not read QEMU_RELEASE from simulate.rs"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building against $tag"

      # `core.autocrlf=false` explicitly: Windows runners default it to true,
      # which would rewrite every line ending in the clone and make the
      # checksum below fail — indistinguishable, in the log, from Espressif
      # having edited the file.
      - name: Clone espressif/qemu
        run: |
          git -c core.autocrlf=false clone --depth 1 \
            --branch "${{ steps.pin.outputs.tag }}" \
            https://github.com/espressif/qemu.git qemu-src

      # macOS has no `sha256sum` — only `shasum -a 256`, which takes the same
      # `-c` file. Assuming the GNU name is how this check would have failed
      # on the platform it was added to test.
      - name: Verify the upstream files are the ones this was written against
        working-directory: qemu-src
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            check="sha256sum -c"
          else
            check="shasum -a 256 -c"
          fi
          if ! $check ../qemu/upstream.sha256; then
            echo "::error::espressif/qemu's GPIO model has changed since qemu/*.c was written."
            exit 1
          fi

      - name: Install the GPIO model
        run: |
          cp qemu/esp32_gpio.c qemu-src/hw/gpio/esp32_gpio.c
          cp qemu/esp32_gpio.h qemu-src/include/hw/gpio/esp32_gpio.h

      # The same flags the Linux job uses, on purpose. Divergence here would
      # muddle the answer: a build that needed different options would not be
      # evidence that *this* build is portable.
      #
      # The output is folded into a single `::error::` on failure because a
      # run's *logs* need admin rights even on a public repository, while
      # annotations are readable by anyone. Without this the entire report of
      # a failed configure is "Process completed with exit code 1" — which is
      # what this step said the first time, costing a whole round trip to
      # learn nothing. `%0A` is how an annotation carries newlines.
      - name: Configure
        working-directory: qemu-src
        run: |
          # meson validates --prefix before it reads anything else, and on
          # Windows an absolute path needs a drive letter. QEMU's configure
          # defaults the mingw prefix to `/qemu`, which meson 1.5 rejects at
          # ../meson.build:1:0 — so the build dies on a path format having
          # already found every dependency and written its options out.
          #
          # `cygpath -m` is what turns an MSYS path into the D:/… form meson
          # wants. Nothing is ever installed from here — the binary is taken
          # straight out of build/, as on the other two platforms — so this
          # only has to satisfy the validation.
          prefix=""
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            prefix="--prefix=$(cygpath -m "$PWD")/qemu-install"
            # -DLIBSLIRP_STATIC, read out of the pinned tag's own meson.build:
            #
            #   slirp_dep = dependency('slirp', …, static: true)
            #   if host_os == 'windows' and get_option('prefer_static')
            #     slirp_cflags += ['-DLIBSLIRP_STATIC']
            #
            # It asks pkg-config for the *static* library unconditionally but
            # only defines the macro that makes libslirp's header agree when
            # prefer_static is set. Without it the header declares every
            # symbol dllimport, and the link ends in undefined `__imp_slirp_*`
            # — which is exactly what happened, 1817 steps in.
            extra="--extra-cflags=-DLIBSLIRP_STATIC"
            echo "using $prefix $extra"
          fi
          # --disable-guest-agent: qemu-ga is a separate program that runs
          # *inside* a guest OS, and nothing about it touches the emulator.
          # On Windows it drags in the VSS provider, which needs Microsoft's
          # Volume Shadow Copy SDK and cannot build without it — the riscv32
          # target had compiled clean and the build still died, at
          # qga/vss-win32/install.cpp, 1593 steps in.
          if ! ./configure \
            $prefix \
            $extra \
            --target-list=riscv32-softmmu \
            --enable-slirp \
            --disable-guest-agent \
            --disable-docs \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-werror > configure.out 2>&1
          then
            detail=$(tail -50 configure.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::configure failed on ${{ matrix.name }}:%0A$detail"
            if [ -f build/meson-logs/meson-log.txt ]; then
              meson=$(tail -60 build/meson-logs/meson-log.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error::meson-log tail:%0A$meson"
            fi
            exit 1
          fi
          tail -25 configure.out
          # What it decided about the options that differ per platform, in a
          # channel readable without admin rights — a run's logs are 403 for
          # anyone without admin, so anything not annotated is invisible.
          decided=$(grep -inE 'slirp|guest.agent' configure.out | head -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice::${{ matrix.name }} configure said about slirp/guest-agent:%0A${decided:-nothing at all}"

      - name: Build
        working-directory: qemu-src
        run: |
          if ! ninja -C build > build.out 2>&1; then
            # From the first FAILED: line onward. An annotation is capped at
            # 4096 characters and the command line ninja echoes is longer
            # than that by itself, so the filtering is about *budget*, not
            # about recognising errors.
            #
            # Which is why it drops by shape — echoed commands start with a
            # quote and are enormous — rather than by matching known error
            # text. A previous version listed the wordings it knew
            # (`error:`, `undefined reference`, `No such file`) and threw
            # away everything else, so a link failure reported as
            # `ld.exe: cannot find -lslirp` arrived as nothing but FAILED:
            # and collect2's exit status. A filter that only recognises the
            # errors you have already seen hides the one you have not.
            detail=$(awk '/^FAILED:/{seen=1} seen' build.out \
              | awk 'length($0) < 300 && $0 !~ /^"/' \
              | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ -z "$detail" ]; then
              detail=$(tail -25 build.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            fi
            echo "::error::the build failed on ${{ matrix.name }}:%0A$detail"
            exit 1
          fi
          tail -5 build.out

      - name: Prove the built binary carries this model
        working-directory: qemu-src
        run: |
          # `if`, not `[ -f … ] && …`: GitHub runs these with `bash -e`, so a
          # bare test that comes back false *ends the step*. macOS has no
          # `.exe`, so the first version of this line failed a step that was
          # only ever meant to look at a filename — and reported it as the
          # model being missing from a binary that had built perfectly.
          bin=build/qemu-system-riscv32
          if [ -f "$bin.exe" ]; then
            bin="$bin.exe"
          fi
          # `grep -a`, not `strings`. macOS's strings reads only the text
          # section by default and the literal lives in __cstring, so the
          # first version of this reported the model missing from a binary
          # that had configured and compiled without a single error — a check
          # failing for a reason that had nothing to do with what it checks.
          if LC_ALL=C grep -aq '\[rusty:gpio@' "$bin"; then
            echo "the GPIO model is compiled into $bin"
          else
            # Say enough to tell a real absence from another tooling quirk.
            echo "::error::built QEMU does not contain the replacement model.%0Abinary=$bin%0Asize=$(wc -c < "$bin")%0Astrings -a hits: $(strings -a "$bin" 2>/dev/null | grep -c 'rusty:gpio' || echo 0)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.os }}
          path: |
            qemu-src/build/qemu-system-riscv32
            qemu-src/build/qemu-system-riscv32.exe
            qemu-src/build/pc-bios/**
          if-no-files-found: error
