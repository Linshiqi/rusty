# Build Espressif's QEMU with a GPIO that keeps its state.
#
# Run from the Actions tab. It clones espressif/qemu at the tag rusty pins,
# replaces the GPIO device model with the one in `qemu/`, builds only the two
# targets this workbench uses, and uploads the binaries.
#
# Why replacement files rather than a patch: the model being replaced is a
# stub, so almost every line changes, and a unified diff's line numbers would
# be the fragile part of an otherwise simple substitution. The checksums do
# the job a patch's context would — if upstream edits the file, the run stops
# and says so rather than quietly discarding their change.
#
# Not part of a release: the binaries are artifacts to test with. Shipping
# them means committing to rebuilding a QEMU fork for three desktops on every
# upstream bump, and that decision comes after the model is proven.

name: qemu

on:
  # Changing the model should compile it. The build is twenty minutes of a
  # free runner and the alternative is finding out later.
  push:
    paths:
      - "qemu/**"
      - ".github/workflows/qemu.yml"
  workflow_dispatch:
    inputs:
      targets:
        description: "QEMU targets to build"
        default: "riscv32-softmmu"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # QEMU's own list for a minimal softmmu build. Slirp is what gives the
      # guest a network without root, and pixman is needed even headless.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev \
            libslirp-dev python3-venv flex bison

      # The tag rusty pins, read from the source rather than repeated here —
      # two copies of a version is one that goes stale.
      - name: Read the pinned QEMU release
        id: pin
        run: |
          # `grep | cut`, not `grep -oP`: PCRE is unavailable under some
          # locales, and a step that fails for *that* reason costs a whole
          # twenty-minute round trip to find out about.
          tag=$(grep 'QEMU_RELEASE: &str' crates/rusty-embed/src/simulate.rs | cut -d'"' -f2)
          if [ -z "$tag" ]; then
            echo "::error::could not read QEMU_RELEASE from simulate.rs"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building against $tag"

      - name: Clone espressif/qemu
        run: |
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            https://github.com/espressif/qemu.git qemu-src

      # The check a patch would have done. If Espressif has edited either
      # file since these were written, the substitution would silently drop
      # their change — so stop, and make somebody read the new source.
      - name: Verify the upstream files are the ones this was written against
        working-directory: qemu-src
        run: |
          if ! sha256sum -c ../qemu/upstream.sha256; then
            echo "::error::espressif/qemu's GPIO model has changed since qemu/*.c was written."
            echo "Re-read hw/gpio/esp32_gpio.c upstream, fold in the change, and update qemu/upstream.sha256."
            exit 1
          fi

      - name: Install the GPIO model
        run: |
          cp qemu/esp32_gpio.c qemu-src/hw/gpio/esp32_gpio.c
          cp qemu/esp32_gpio.h qemu-src/include/hw/gpio/esp32_gpio.h

      - name: Configure
        working-directory: qemu-src
        run: |
          ./configure \
            --target-list="${{ inputs.targets || 'riscv32-softmmu' }}" \
            --enable-slirp \
            --disable-docs \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-werror

      - name: Build
        working-directory: qemu-src
        run: ninja -C build

      # Proof the binary contains *our* model and not the stub it replaced.
      #
      # By string rather than by `-device help`: `esp32.gpio` is a sysbus
      # device and may not be user-creatable, so a help probe can come back
      # empty for reasons that have nothing to do with whether the code is
      # in there. The report format is a literal only this file has.
      #
      # Fatal, not a warning. The first version of this step could not fail,
      # which made a green run mean nothing — the same tautology this
      # project has already caught itself writing in a test.
      - name: Prove the built binary carries this model
        working-directory: qemu-src
        run: |
          if strings build/qemu-system-riscv32 | grep -q '\[rusty:gpio@'; then
            echo "the GPIO model is compiled in"
          else
            echo "::error::built QEMU does not contain the replacement model —"
            echo "the copy step or the build picked up the stub instead."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-linux-x86_64
          path: |
            qemu-src/build/qemu-system-riscv32
            qemu-src/build/pc-bios/**
          if-no-files-found: error
