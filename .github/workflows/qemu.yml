# Espressif's QEMU with a GPIO that keeps its state — built, proven, shipped.
#
# Three jobs, in that order:
#
#   build    one per desktop. Clones espressif/qemu at the tag rusty pins,
#            checks the two files being replaced are the ones the model was
#            written against, builds both target lists and packages the
#            result in Espressif's own layout so it is a drop-in.
#   prove    unpacks the *packaged* Linux build and boots real firmware
#            through it. Deliberately the shipped artifact rather than a
#            second build: proving one binary and shipping another is how a
#            green run comes to mean nothing.
# Publishing lives in `qemu-release.yml`, which calls this one and then
# attaches the packages to a Release. Two files rather than a tag filter here:
# `on.push` applies `paths` and `tags` together, so a release tag on a commit
# that happens not to touch qemu/ would silently not build.
#
# Why replacement files rather than a patch: the model being replaced is a
# stub, so almost every line changes, and a unified diff's line numbers would
# be the fragile part of an otherwise total substitution. The checksums do the
# job a patch's context would — if upstream edits the file, the run stops and
# says so rather than quietly discarding their change.

name: qemu

on:
  push:
    branches: ["master"]
    paths:
      - "qemu/**"
      - ".github/workflows/qemu.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build for ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: x86_64-linux-gnu
            shell: bash
          - os: macos-latest
            label: aarch64-apple-darwin
            shell: bash
          - os: macos-13
            label: x86_64-apple-darwin
            shell: bash
          - os: windows-latest
            label: x86_64-w64-mingw32
            # QEMU on Windows builds under MSYS2's mingw64 — the route
            # upstream documents, and the reason every step below has to run
            # in that shell rather than in PowerShell.
            shell: "msys2 {0}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # Before any `run` step: the shell default above applies to all of them,
      # so on Windows there is no shell to run in until this has set one up.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git binutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-python

      - name: Build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev \
            libslirp-dev libgcrypt20-dev python3-venv flex bison

      # dylibbundler: a macOS build links Homebrew's glib and pixman by
      # absolute path, so without this the tarball only runs on a machine
      # that already has the same Homebrew. It copies each dependency in and
      # rewrites the install names to point at the copy.
      - name: Build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config glib pixman libslirp libgcrypt dylibbundler

      # Fail at minute two rather than at minute twenty. A missing header
      # surfaces as a compile error deep in the build, on whichever file
      # happens to include it first, and reads like a source problem — which
      # is exactly how gcrypt.h was diagnosed twice.
      - name: The headers the build needs are actually there
        run: |
          missing=""
          for header in glib-2.0/glib.h pixman.h gcrypt.h; do
            found=""
            for dir in /usr/include /usr/local/include /mingw64/include \
                       /opt/homebrew/include /opt/homebrew/opt/libgcrypt/include \
                       /usr/include/glib-2.0 /usr/include/pixman-1 \
                       /mingw64/include/pixman-1 /opt/homebrew/include/pixman-1; do
              [ -f "$dir/$header" ] && found="$dir/$header" && break
            done
            if [ -n "$found" ]; then
              echo "ok   $header -> $found"
            else
              echo "MISS $header"
              missing="$missing $header"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::${{ matrix.label }} is missing:$missing — the dependency step \
            above did not install what it claims to. This is what a 'source' error twenty \
            minutes into the build actually is."
            exit 1
          fi

      # The tag rusty pins, read from the source rather than repeated here —
      # two copies of a version is one that goes stale.
      - name: Read the pinned QEMU release
        id: pin
        run: |
          # `grep | cut`, not `grep -oP`: PCRE is unavailable under some
          # locales, and a step that fails for *that* reason costs a whole
          # twenty-minute round trip to find out about.
          tag=$(grep 'QEMU_RELEASE: &str' crates/rusty-embed/src/simulate.rs | cut -d'"' -f2)
          if [ -z "$tag" ]; then
            echo "::error::could not read QEMU_RELEASE from simulate.rs"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building against $tag"

      # `core.autocrlf=false` explicitly: Windows runners default it to true,
      # which would rewrite every line ending in the clone and make the
      # checksum below fail — indistinguishable, in the log, from Espressif
      # having edited the file.
      - name: Clone espressif/qemu
        run: |
          git -c core.autocrlf=false clone --depth 1 \
            --branch "${{ steps.pin.outputs.tag }}" \
            https://github.com/espressif/qemu.git qemu-src

      # The check a patch would have done. If Espressif has edited either
      # file since these were written, the substitution would silently drop
      # their change — so stop, and make somebody read the new source.
      #
      # macOS has no `sha256sum`, only `shasum -a 256`, which takes the same
      # `-c` file. Assuming the GNU name is how this check would have failed
      # on the platform it was added to test.
      - name: Verify the upstream files are the ones this was written against
        working-directory: qemu-src
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            check="sha256sum -c"
          else
            check="shasum -a 256 -c"
          fi
          if ! $check ../qemu/upstream.sha256; then
            echo "::error::espressif/qemu's GPIO model has changed since qemu/*.c was written."
            echo "Re-read hw/gpio/esp32_gpio.c upstream, fold in the change, and update qemu/upstream.sha256."
            exit 1
          fi

      - name: Install the GPIO model
        run: |
          cp qemu/esp32_gpio.c qemu-src/hw/gpio/esp32_gpio.c
          cp qemu/esp32_gpio.h qemu-src/include/hw/gpio/esp32_gpio.h

      # Both target lists. riscv32 covers the C3 and C6; xtensa covers the
      # original ESP32 and the S3, which is the part most people own — a
      # package with only one of them would leave half the catalogue on the
      # stock emulator with no sign of why.
      #
      # --enable-gcrypt is what makes xtensa buildable, and it is not
      # optional. `hw/misc/esp32_flash_enc.c` opens with a bare
      #
      #     #include <gcrypt.h>
      #
      # before even qemu/osdep.h, while hw/misc/meson.build adds the file for
      # CONFIG_XTENSA_ESP32 with no gcrypt dependency attached. So the include
      # path arrives only if QEMU's *global* crypto backend happens to be
      # gcrypt — which is what Ubuntu picks and what macOS and Windows do not,
      # where meson finds gnutls and nettle first. Naming the backend makes it
      # the same build everywhere instead of one that depends on which crypto
      # library each platform's package manager offers first.
      #
      # Installing libgcrypt is necessary and was not sufficient: the header
      # was present on macOS and the compiler still could not see it.
      #
      # --disable-gnutls follows from that choice. Switching the backend left
      # macOS building crypto/tlscreds.c without gnutls's include path, and
      # rather than chase that path, ask whether a local emulator needs TLS at
      # all. It does not — a serial line and a pin chardev, no VNC, no
      # migration, no NBD — so the whole dependency goes, and with it one more
      # way for the four platforms to differ.
      - name: Configure
        working-directory: qemu-src
        run: |
          # An explicit prefix inside the build tree on every platform, so
          # `ninja install` lays the package out without sudo and without
          # touching the runner. It is also required on Windows: meson
          # validates --prefix before reading anything else and wants a drive
          # letter, while QEMU's configure defaults the mingw prefix to
          # `/qemu`, which meson 1.5 rejects at ../meson.build:1:0.
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            prefix="--prefix=$(cygpath -m "$PWD")/qemu-install"
            # Two flags, each earned by a failed build, and neither optional:
            #
            # --disable-debug-info keeps a very large PE within what mingw's
            #   ld handles. Nothing shipped from here needs it.
            #
            # -DLIBSLIRP_STATIC because the tag's own meson.build asks
            #   pkg-config for the *static* libslirp unconditionally, and adds
            #   the macro that makes libslirp's header agree only when
            #   prefer_static is set. Without it the header declares every
            #   symbol dllimport and the link ends in undefined
            #   `__imp_slirp_*`. (Dropped once by a rewrite of this file, and
            #   it stayed hidden for three runs because Windows was failing
            #   earlier, at gcrypt, and never reached the link.)
            extra="--disable-debug-info --extra-cflags=-DLIBSLIRP_STATIC"
          else
            prefix="--prefix=$PWD/qemu-install"
          fi
          echo "using $prefix $extra"
          # --disable-guest-agent: qemu-ga is a program that runs *inside* a
          # guest OS and touches nothing in the emulator. On Windows it drags
          # in the VSS provider, which needs Microsoft's Volume Shadow Copy
          # SDK and cannot build without it.
          if ! ./configure \
            $prefix \
            $extra \
            --target-list=riscv32-softmmu,xtensa-softmmu \
            --enable-slirp \
            --enable-gcrypt \
            --disable-gnutls \
            --disable-guest-agent \
            --disable-docs \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-werror > configure.out 2>&1
          then
            detail=$(tail -50 configure.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::configure failed on ${{ matrix.label }}:%0A$detail"
            if [ -f build/meson-logs/meson-log.txt ]; then
              meson=$(tail -60 build/meson-logs/meson-log.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error::meson-log tail:%0A$meson"
            fi
            exit 1
          fi
          tail -25 configure.out

      - name: Build
        working-directory: qemu-src
        run: |
          if ! ninja -C build > build.out 2>&1; then
            # The failed block: FAILED: up to the next ninja progress line,
            # which is where the failing command's own output ends.
            block=$(awk '/^FAILED:/{seen=1} seen && /^\[[0-9]+\/[0-9]+\]/{exit} seen' build.out)
            # Drop the echoed command by *length*, not by shape. It comes back
            # quoted on Windows (`"cc" "-m64" …`) and bare on the other two
            # (`cc -Ilibcommon… `), and a filter that only knew the quoted form
            # let a 1500-character line eat the whole annotation budget on
            # macOS — the report arrived saying "6 lines, 6 after dropping
            # echoed commands" with the error nowhere in it. 400 is far above
            # any diagnostic ld or cc emits and far below any command line.
            kept=$(printf '%s\n' "$block" | awk 'length($0) < 400')

            # Say what was thrown away. Every earlier version of this step
            # reported only what survived its filter, so a filter eating the
            # diagnosis looked exactly like a toolchain that produced none —
            # and those need different fixes.
            echo "::error::the build failed on ${{ matrix.label }}: failed block \
            $(printf '%s\n' "$block" | wc -l) lines, \
            $(printf '%s\n' "$kept" | wc -l) after dropping echoed commands"

            # In chunks: one annotation is capped at 4096 characters, and a
            # run's logs need admin rights on the repository, so annotations
            # are the only channel that reaches anyone.
            #
            # `END{printf "\n"}` is load-bearing — without a trailing newline
            # `read` drops the final chunk, and the folded output is usually
            # a single chunk, so the whole report vanishes.
            printf '%s\n' "$kept" | head -80 | sed 's/%/%25/g' \
              | awk '{printf "%s%%0A", $0} END{printf "\n"}' | fold -w 3500 \
              | while IFS= read -r chunk; do
                  echo "::error::…$chunk"
                done
            exit 1
          fi
          tail -5 build.out

      # Espressif's own layout — `qemu/bin` beside `qemu/share/qemu` — because
      # rusty's downloader unpacks into the data directory's tools/ and looks
      # for tools/qemu/bin. A package that needs a different unpack is not a
      # drop-in, and the fallback to Espressif's build would then land
      # somewhere else.
      #
      # `ninja install` rather than copying by hand: QEMU decides what belongs
      # in share/qemu, and a hand-picked list is a list that goes stale on the
      # next bump with the symptom of a missing bios blob at boot.
      - name: Package
        working-directory: qemu-src
        run: |
          ninja -C build install > install.out 2>&1 || {
            tail -30 install.out
            echo "::error::ninja install failed on ${{ matrix.label }}"
            exit 1
          }
          root="$PWD/../package"
          rm -rf "$root"
          mkdir -p "$root/qemu"
          installed="$PWD/qemu-install"
          cp -R "$installed/bin" "$root/qemu/bin"
          cp -R "$installed/share" "$root/qemu/share"
          # Only the two emulators. `ninja install` also lays down qemu-img and
          # friends, and none of them are what rusty runs.
          find "$root/qemu/bin" -type f \
            ! -name 'qemu-system-riscv32*' ! -name 'qemu-system-xtensa*' -delete
          ls -la "$root/qemu/bin"

      # A dynamically linked build carries its libraries' absolute paths, so
      # without this the package runs only where it was built. Espressif ships
      # these beside the exe too; a user who has to install MSYS2 or Homebrew
      # first is a user for whom this did not work.
      - name: Bring the libraries along
        working-directory: package/qemu
        if: runner.os != 'Linux'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # ldd resolves the mingw DLLs by name; anything under /mingw64 is
            # ours to ship, anything under /c/Windows belongs to the OS.
            for exe in bin/*.exe; do
              ldd "$exe" | awk '/=> \/mingw64/ {print $3}'
            done | sort -u | while IFS= read -r dll; do
              cp -n "$dll" bin/ || true
            done
            ls bin/ | head -40
          else
            for exe in bin/qemu-system-*; do
              dylibbundler -od -b -x "$exe" -d libs -p '@executable_path/../libs/' \
                || { echo "::error::dylibbundler failed for $exe"; exit 1; }
            done
            ls libs/ | head -40
          fi

      # The proof the binary is ours and not the stub it replaced.
      #
      # `grep -a` rather than `strings`: macOS's strings reads only the text
      # section by default and the marker lives in __cstring, so it reported
      # this model absent from a binary that had built perfectly. One method
      # across every platform, since this is one question.
      - name: Prove the packaged binaries carry this model
        working-directory: package/qemu/bin
        run: |
          for arch in riscv32 xtensa; do
            bin="qemu-system-$arch"
            if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
            if LC_ALL=C grep -aq '\[rusty:gpio@' "$bin"; then
              echo "the GPIO model is compiled into $bin"
            else
              echo "::error::$bin does not contain the replacement model.%0Asize=$(wc -c < "$bin")"
              exit 1
            fi
          done

      - name: Name and compress it
        run: |
          version="${GITHUB_REF_NAME#qemu-}"
          case "$version" in refs/*|master|main) version="dev-${GITHUB_SHA::7}" ;; esac
          name="qemu-rusty-$version-${{ matrix.label }}"
          echo "$version" > package/qemu/RUSTY_VERSION
          tar -C package -cJf "$name.tar.xz" qemu
          ls -la "$name.tar.xz"
          echo "PACKAGE=$name.tar.xz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.label }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  # Boot real firmware through the package that would ship.
  #
  # blink-rust is the ideal subject because it drives GPIO0 *and* prints
  # `[rusty:gpio]` itself — two independent accounts of one pin, so they can
  # be checked against each other rather than either taken on trust.
  prove:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qemu-x86_64-linux-gnu
          path: package

      - name: Unpack exactly as a user's install would
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libpixman-1-0 libslirp0
          mkdir -p tools
          tar -C tools -xf package/*.tar.xz
          tools/qemu/bin/qemu-system-riscv32 --version
          tools/qemu/bin/qemu-system-xtensa --version

      - name: Rust for the target
        run: rustup target add riscv32imc-unknown-none-elf

      # The action first: `cargo binstall` is not a command a runner has.
      # Building espflash from source is the fallback rather than the default.
      - uses: cargo-bins/cargo-binstall@main

      - name: espflash, for the flash image
        run: cargo binstall --no-confirm espflash || cargo install --locked espflash

      - name: Build blinky and make its image
        working-directory: examples/blink-rust
        run: |
          cargo build --release
          mkdir -p target/sim
          espflash save-image --chip esp32c3 --merge \
            target/riscv32imc-unknown-none-elf/release/blink-rust \
            target/sim/flash.bin

      # `-global`, because the machine creates the GPIO device — there is no
      # `-device` line to hang a chardev off.
      - name: Boot it and watch the pins
        run: |
          timeout 25 tools/qemu/bin/qemu-system-riscv32 \
            -M esp32c3 -nographic \
            -drive "file=examples/blink-rust/target/sim/flash.bin,if=mtd,format=raw" \
            -serial file:serial.log \
            -chardev file,id=pins,path=pins.log \
            -global driver=esp32.gpio,property=pins,value=pins \
            > qemu.out 2>&1 || true
          echo "─── the pin channel ───"
          head -20 pins.log 2>/dev/null || echo "(no pins.log at all)"
          echo "─── what the firmware said ───"
          grep -m5 'rusty:gpio' serial.log 2>/dev/null || echo "(no firmware report)"
          echo "─── qemu's own output ───"
          head -10 qemu.out

      # Refuse to call this proven on a file that exists but is empty — the
      # exact shape of the release that shipped no installer.
      - name: The pin channel carried something
        run: |
          if [ ! -s pins.log ]; then
            echo "::error::the GPIO chardev produced nothing. Either -global is"
            echo "the wrong way to reach a machine-created device, or the model"
            echo "is not seeing the writes esp-hal makes."
            exit 1
          fi
          lines=$(grep -c 'rusty:gpio@' pins.log || echo 0)
          echo "$lines pin reports from the emulator itself"
          [ "$lines" -gt 0 ]

      # A line arriving proves the channel works; it does not prove the
      # *level* is right, and a model reporting a stuck 1 would pass
      # everything above.
      - name: The emulator and the firmware agree about GPIO0
        shell: python
        run: |
          import re, sys

          def levels(path):
              out = []
              try:
                  text = open(path, encoding="utf-8", errors="replace").read()
              except OSError:
                  return out
              for line in text.splitlines():
                  if "rusty:gpio" not in line:
                      continue
                  found = re.search(r"\b0=([01])\b", line)
                  if found:
                      out.append(int(found.group(1)))
              return out

          emulator = levels("pins.log")
          firmware = levels("serial.log")
          print("emulator :", emulator[:12])
          print("firmware :", firmware[:12])

          def stop(why):
              """Fail with the evidence attached.

              An `::error::` becomes an annotation, which survives the run and
              is readable without admin rights on the repository. `sys.exit(msg)`
              writes to stderr, which is neither.
              """
              print(f"::error::{why} | emulator={emulator[:12]} firmware={firmware[:12]}")
              sys.exit(1)

          if len(emulator) < 4:
              stop(f"the emulator reported GPIO0 only {len(emulator)} times; "
                   "blinky toggles it, so the model is missing writes")

          # Consecutive repeats mean a write was seen but the level was
          # computed wrong — a stuck pin reported over and over.
          if any(a == b for a, b in zip(emulator, emulator[1:])):
              stop("the emulator's GPIO0 does not alternate")

          if not firmware:
              stop("the firmware printed no GPIO report, so there is "
                   "nothing to check the emulator against")

          # The two do not start together, and should not. `Output::new` sets
          # the pin's direction and initial level *before* the loop that does
          # the printing, so the emulator legitimately knows about transitions
          # the firmware never announced. Demanding they agree on element zero
          # was the first version of this check, and it rejected a model that
          # was working — for being more truthful than the firmware.
          offset = None
          for lead in range(4):
              overlap = min(len(emulator) - lead, len(firmware), 8)
              if overlap >= 4 and emulator[lead:lead + overlap] == firmware[:overlap]:
                  offset = lead
                  break

          if offset is None:
              stop("the emulator's account does not contain the firmware's")

          print(f"both accounts of GPIO0 agree, the emulator leading by {offset} "
                "— the pin being configured, which the firmware never printed")

      # Everything above proves the *output* half. The input half — a host
      # driving a level that unmodified firmware reads through GPIO_IN — has
      # no witness in blinky, which never reads a pin.
      - name: Build the input probe and make its image
        working-directory: qemu/gpio-probe
        run: |
          cargo build --release
          mkdir -p target/sim
          espflash save-image --chip esp32c3 --merge \
            target/riscv32imc-unknown-none-elf/release/gpio-probe \
            target/sim/flash.bin

      # A socket chardev, not a file: this direction needs somebody able to
      # write, and `-chardev file` is one-way.
      - name: A host-driven pin reaches the firmware's is_high()
        shell: python
        run: |
          import re, socket, subprocess, sys, time

          IMAGE = "qemu/gpio-probe/target/sim/flash.bin"
          SERIAL = "probe-serial.log"
          PORT = 5555

          def read():
              try:
                  return open(SERIAL, encoding="utf-8", errors="replace").read()
              except OSError:
                  return ""

          def levels():
              """Every level the firmware printed, in order.

              It prints on *change*, so this is the transition sequence — and
              comparing a sequence is what lets the second half of the test
              fail distinctly. Waiting for "gpio4=0" a second time would match
              the first occurrence and pass without the pin coming back down.
              """
              return [int(m) for m in re.findall(r"\[probe\] gpio4=([01])", read())]

          def stop(why):
              print(f"::error::{why} | levels={levels()}")
              print("--- serial ---")
              print(read()[-1500:])
              sys.exit(1)

          def settle(count, seconds, why):
              deadline = time.time() + seconds
              while time.time() < deadline:
                  if len(levels()) >= count:
                      return
                  time.sleep(0.25)
              stop(why)

          qemu = subprocess.Popen(
              [
                  "tools/qemu/bin/qemu-system-riscv32", "-M", "esp32c3", "-nographic",
                  "-drive", f"file={IMAGE},if=mtd,format=raw",
                  "-serial", f"file:{SERIAL}",
                  "-chardev",
                  f"socket,id=pins,host=127.0.0.1,port={PORT},server=on,wait=off",
                  "-global", "driver=esp32.gpio,property=pins,value=pins",
              ],
              stdout=open("probe-qemu.out", "w"), stderr=subprocess.STDOUT,
          )
          try:
              settle(1, 60, "the probe never reported GPIO4 at all — it did not "
                            "boot, or reading GPIO_IN does not come back")
              print(f"booted, GPIO4 reads {levels()[0]}")

              link = socket.create_connection(("127.0.0.1", PORT), timeout=15)

              link.sendall(b"4=1\n")
              settle(2, 25, "the host drove GPIO4 high and the firmware never "
                            "saw it — the input half does not reach GPIO_IN")

              # Back down, because a model that ORed every write into `in`
              # would have passed everything above this line.
              link.sendall(b"4=0\n")
              settle(3, 25, "GPIO4 went high and would not come back down — "
                            "the model sets bits but never clears them")

              seen = levels()[:3]
              if seen != [0, 1, 0]:
                  stop(f"expected the pin to read 0, then 1, then 0; got {seen}")
              print("0 → 1 → 0, driven from the host and read through GPIO_IN")
          finally:
              qemu.kill()

      - uses: actions/upload-artifact@v4
        # Especially on failure: the logs are the evidence for whatever the
        # comparison above rejected, and a step that only runs when the run
        # succeeded throws them away exactly when they are needed.
        if: always()
        with:
          name: pin-logs
          path: |
            pins.log
            serial.log
            probe-serial.log
            probe-qemu.out
          if-no-files-found: warn
